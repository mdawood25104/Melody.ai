services:
  db:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: melodyai}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U postgres"], interval: 5s, retries: 10}
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/melodyai
      LOCAL_STORAGE_PATH: /data
    volumes: [./storage:/data]
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
  frontend:
    image: node:20
    working_dir: /app
    volumes: [./frontend:/app]
    environment: {API_TARGET: "http://backend:8000"}
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
volumes: {pgdata: {}}
